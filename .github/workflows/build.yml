# This workflow will install Python dependencies, build the binaries for Windows and Ubuntu, and copy the "sounds" directory.

name: Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller -F --noconsole -n breakout.exe hbreakout.py  # Use .exe as the name

      - name: Copy sounds directory
        run: |
          mkdir dist\breakout\sounds
          xcopy /E /I sounds dist\breakout\sounds

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: |
            dist\breakout.exe  # Corrected to match output binary
            dist\breakout\sounds\*

  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller -F --noconsole -n breakout hbreakout.py  # Ubuntu binary

      - name: Copy sounds directory
        run: |
          mkdir -p dist/breakout/sounds
          cp -r sounds dist/breakout/sounds

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-binary
          path: |
            dist/breakout  # Include the binary file without extension
            dist/breakout/sounds/*
